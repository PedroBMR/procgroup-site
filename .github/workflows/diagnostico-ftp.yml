# Diagnostico do FTP: mostra ONDE a conta cai ao conectar e o que existe la.
#
# Criado em 2026-09-25 porque o primeiro deploy para a Hostinger terminou com
# sucesso, enviou as 98 paginas, e o site continuou servindo o WordPress: os
# arquivos nao apareceram nem em public_html nem num public_html duplicado.
# Chutar caminho custa 7 minutos por tentativa; isto responde em um.
#
# Roda so a mao (Actions > Diagnostico FTP > Run workflow). As credenciais vem
# dos mesmos secrets do deploy, e o GitHub mascara secret no log.
name: Diagnostico FTP

on:
  workflow_dispatch:

jobs:
  olhar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Um arquivo-sonda: pequeno, inofensivo e facil de procurar depois pela
      # web. Se ele aparecer em https://procgroup.com.br/_sonda.txt, o caminho
      # esta certo; se nao aparecer, esta indo para fora do diretorio servido.
      - name: Preparar a sonda
        run: |
          mkdir -p sonda
          echo "sonda de deploy $(date -u +%FT%TZ)" > sonda/_sonda.txt

      # A mesma action do deploy, que ja provou que conecta. O log verbose diz
      # em que diretorio ela entra e o que encontra la.
      - name: Enviar a sonda e mostrar o caminho
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./sonda/
          server-dir: ./
          log-level: verbose
          dry-run: false
